name: Plugin regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    name: deterministic (${{ matrix.os }}, ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix mcp-server
      - run: node --check mcp-server/index.js
      - run: bash tests/run-all.sh
      - run: npm audit --prefix mcp-server --omit=dev
  examples:
    name: examples
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: tests/examples/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: EXAMPLES_MAVEN_CACHE="$HOME/.m2/repository" bash tests/examples/check.sh
  real-builds:
    name: real Maven and Gradle builds
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
      - name: Install pinned Maven with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.10.0-bin.tar.gz"
          base='https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz'
          curl --fail --silent --show-error --location "$base" --output "$archive"
          curl --fail --silent --show-error --location "$base.sha512" --output "$archive.sha512"
          python3 - "$archive" <<'PY'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          expected = pathlib.Path(str(archive) + '.sha512').read_text().split()[0]
          if hashlib.sha512(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Maven SHA-512 verification failed')
          PY
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.0/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix mcp-server
      - run: bash tests/build-fixtures/check.sh
