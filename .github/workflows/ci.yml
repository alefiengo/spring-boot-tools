name: Plugin regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix mcp-server
      - run: node --check mcp-server/index.js
      - run: bash tests/run-all.sh
      - run: npm audit --prefix mcp-server --omit=dev
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: tests/examples/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: EXAMPLES_MAVEN_CACHE="$HOME/.m2/repository" bash tests/examples/check.sh
